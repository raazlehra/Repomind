name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest

  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run Ruff
        run: python -m ruff check .
      - name: Run mypy
        run: python -m mypy repomind
      - name: Build wheel and source distribution
        run: python -m build
      - name: Verify release artifacts
        run: python scripts/verify_release_artifacts.py --dist-dir dist
      - name: Smoke-test the installed wheel
        run: python scripts/installed_wheel_smoke.py --wheel dist
      - name: Smoke-test the optional Tree-sitter backend
        run: python scripts/installed_wheel_smoke.py --wheel dist --treesitter

  windows-wheel-smoke:
    name: windows-wheel-smoke
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
      - name: Build wheel and source distribution
        run: python -m build
      - name: Verify release artifacts
        run: python scripts/verify_release_artifacts.py --dist-dir dist
      - name: Smoke-test the installed wheel
        run: python scripts/installed_wheel_smoke.py --wheel dist
      - name: Smoke-test the optional Tree-sitter backend
        run: python scripts/installed_wheel_smoke.py --wheel dist --treesitter
